<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Vulnerability Scanner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-3">🔍 Python Project Vulnerability Scanner</h3>
        <form method="POST">
            <div class="mb-3">
                <label for="git_url" class="form-label">GitHub Repository URL</label>
                <input type="url" class="form-control" id="git_url" name="git_url" placeholder="https://github.com/username/repo.git" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Scan Repository</button>
        </form>
        <hr>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
    </div>
</div>
</body>
</html>
